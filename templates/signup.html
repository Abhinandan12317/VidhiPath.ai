{% extends "base.html" %}

{% block title %}Sign Up - VidhiPath.ai{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 2rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <i class="fas fa-user-plus" style="font-size: 3rem; color: #059669; margin-bottom: 1rem;"></i>
            <h2 style="color: #059669; margin: 0;">Create Your Account</h2>
            <p style="color: #6b7280; margin-top: 0.5rem;">Join VidhiPath.ai for free legal assistance</p>
        </div>

        <form method="POST" id="signupForm">
            <div class="form-group">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" id="name" name="name" class="form-input" required>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" required minlength="6">
                <small style="color: #6b7280; font-size: 0.875rem;">Minimum 6 characters</small>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input" required>
            </div>

            <!-- Add this inside your signup form -->
           <div class="form-group">
    <label for="role" class="form-label">Role:</label>
    <select name="role" id="role" class="form-input">
        <option value="user">User</option>
        <option value="admin">Admin</option>
    </select>
</div>

            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" required style="width: auto;">
                    <span style="font-size: 0.875rem; color: #6b7280;">
                        I agree to the <a href="#" style="color: #1e40af;">Terms of Service</a> and 
                        <a href="#" style="color: #1e40af;">Privacy Policy</a>
                    </span>
                </label>
            </div>

            <button type="submit" class="btn btn-secondary" style="width: 100%; justify-content: center;" id="signupBtn">
                <i class="fas fa-user-plus"></i>
                Create Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e5e7eb;">
            <p style="color: #6b7280; margin-bottom: 1rem;">Already have an account?</p>
            <a href="{{ url_for('login') }}" class="btn btn-outline" style="width: 100%; justify-content: center;">
                <i class="fas fa-sign-in-alt"></i>
                Sign In Instead
            </a>
        </div>
    </div>

    <div style="text-align: center; margin-top: 1rem;">
        <a href="{{ url_for('index') }}" style="color: #6b7280; text-decoration: none;">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('signupForm').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (password !== confirmPassword) {
        e.preventDefault();
        alert('Passwords do not match!');
        return;
    }
    
    const btn = document.getElementById('signupBtn');
    btn.innerHTML = '<div class="loading"></div> Creating Account...';
    btn.disabled = true;
});
</script>
{% endblock %}
